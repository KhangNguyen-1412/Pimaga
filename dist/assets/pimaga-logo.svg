    <!-- 8. The 3D Sculptured Pi (π) Symbol -->
    <g filter="url(#pi-depth-shadow)">

      <!-- LAYER A: 3D Depth Extrusion Base (Deep Obsidian Drop 10px) -->
      <g fill="#020617" opacity="0.95" transform="translate(0, 8)">
        
        <path d="M 120,166 C 126,156 138,150 154,150 L 366,150 C 382,150 392,158 392,168 C 392,176 384,180 374,178 L 360,178 L 148,176 C 136,176 128,180 122,180 C 116,180 114,174 120,166 Z" />
