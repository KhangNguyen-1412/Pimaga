      <line x1="54.0" y1="256.0" x2="40.0" y2="256.0" stroke="#2A52BE" stroke-opacity="0.85" stroke-width="2.0" />
      <line x1="50.2" y1="219.7" x2="43.3" y2="218.5" stroke="#64748B" stroke-opacity="0.3" stroke-width="1.0" />
